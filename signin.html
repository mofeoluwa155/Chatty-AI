<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Chatty AI - Modern intelligent assistant">
    <meta name="author" content="Created by Akintayo Mofeoluwa Richard">
    <title>Sign In — Chatty AI</title>
    <!-- Created by Akintayo Mofeoluwa Richard -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <main class="auth-container">
        <div class="auth-card">
            
            <header class="auth-header">
                <div class="auth-logo-box">
                    <img src="assets/logo.png" alt="Chatty AI Official Logo" class="auth-logo-img">
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to continue to Chatty AI</p>
            </header>

            <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite">
                <span id="auth-alert-message"></span>
            </div>

            <form id="signin-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="name@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" id="btn-toggle-password" class="btn-toggle-password" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-auth-submit">
                    <span id="btn-submit-text">Sign In</span>
                </button>
            </form>

            <footer class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Create an account</a></p>
            </footer>

        </div>
    </main>

    <script type="module">
        import { signInUser, formatAuthError, redirectIfAuthenticated } from "./auth.js";

        // Redirect if already authenticated
        redirectIfAuthenticated("index.html");

        const form = document.getElementById("signin-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const alertEl = document.getElementById("auth-alert");
        const alertMsg = document.getElementById("auth-alert-message");
        const submitBtn = document.getElementById("btn-submit");
        const submitText = document.getElementById("btn-submit-text");
        const togglePwdBtn = document.getElementById("btn-toggle-password");

        let showPassword = false;

        togglePwdBtn.addEventListener("click", () => {
            showPassword = !showPassword;
            passwordInput.type = showPassword ? "text" : "password";
            togglePwdBtn.style.color = showPassword ? "#00f0ff" : "";
        });

        const showAlert = (message) => {
            alertMsg.textContent = message;
            alertEl.classList.add("is-visible");
        };

        const hideAlert = () => {
            alertEl.classList.remove("is-visible");
            alertMsg.textContent = "";
        };

        const setLoading = (loading) => {
            submitBtn.disabled = loading;
            submitText.textContent = loading ? "Signing in..." : "Sign In";
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert("Please enter both your email address and password.");
                return;
            }

            try {
                setLoading(true);
                await signInUser(email, password);
                window.location.replace("index.html");
            } catch (err) {
                setLoading(false);
                showAlert(formatAuthError(err));
            }
        });
    </script>
</body>
</html>
