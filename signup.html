<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Chatty AI account">
    <meta name="author" content="Created by Akintayo Mofeoluwa Richard">
    <title>Create Account — Chatty AI</title>
    <!-- Created by Akintayo Mofeoluwa Richard -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <main class="auth-container">
        <div class="auth-card">
            
            <header class="auth-header">
                <div class="auth-logo-box">
                    <img src="assets/logo.png" alt="Chatty AI Official Logo" class="auth-logo-img">
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Chatty AI to start intelligent conversations</p>
            </header>

            <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite">
                <span id="auth-alert-message"></span>
            </div>

            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">Your Name</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            class="form-input" 
                            placeholder="Mofe Richard" 
                            required 
                            autocomplete="name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="name@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="At least 6 characters" 
                            required 
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            class="form-input" 
                            placeholder="Repeat your password" 
                            required 
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-auth-submit">
                    <span id="btn-submit-text">Create Account</span>
                </button>
            </form>

            <footer class="auth-footer">
                <p>Already have an account? <a href="signin.html">Sign in</a></p>
            </footer>

        </div>
    </main>

    <script type="module">
        import { signUpUser, formatAuthError, redirectIfAuthenticated } from "./auth.js";

        // Redirect if already authenticated
        redirectIfAuthenticated("index.html");

        const form = document.getElementById("signup-form");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const alertEl = document.getElementById("auth-alert");
        const alertMsg = document.getElementById("auth-alert-message");
        const submitBtn = document.getElementById("btn-submit");
        const submitText = document.getElementById("btn-submit-text");

        const showAlert = (message) => {
            alertMsg.textContent = message;
            alertEl.classList.add("is-visible");
        };

        const hideAlert = () => {
            alertEl.classList.remove("is-visible");
            alertMsg.textContent = "";
        };

        const setLoading = (loading) => {
            submitBtn.disabled = loading;
            submitText.textContent = loading ? "Creating account..." : "Create Account";
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!name) {
                showAlert("Please enter your name.");
                return;
            }

            if (!email) {
                showAlert("Please enter your email address.");
                return;
            }

            if (password.length < 6) {
                showAlert("Password must be at least 6 characters long.");
                return;
            }

            if (password !== confirmPassword) {
                showAlert("Passwords do not match. Please re-enter.");
                return;
            }

            try {
                setLoading(true);
                await signUpUser(email, password, name);
                window.location.replace("index.html");
            } catch (err) {
                setLoading(false);
                showAlert(formatAuthError(err));
            }
        });
    </script>
</body>
</html>
